<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 완료 - OpenNow AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #1e293b;
    }
    p {
      color: #64748b;
      margin-bottom: 24px;
    }
    .amount {
      font-size: 2rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 24px;
    }
    .info-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .info-box h3 {
      font-size: 0.875rem;
      color: #16a34a;
      margin-bottom: 8px;
    }
    .info-box p {
      font-size: 0.875rem;
      margin: 0;
      color: #1e293b;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✓</div>
    <h1>결제가 완료되었습니다!</h1>
    <p>출장비 결제가 성공적으로 처리되었습니다.</p>
    <div class="amount" id="amount">₩35,000</div>

    <div class="info-box">
      <h3>📍 다음 단계</h3>
      <p>기사님 매칭이 자동으로 시작됩니다.<br>ChatGPT 대화창에서 진행 상황을 확인하세요.</p>
    </div>

    <a href="https://chat.openai.com" class="btn">ChatGPT로 돌아가기</a>

    <div class="footer">
      결제 문의: support@opennow.ai
    </div>
  </div>

  <script>
    // Parse payment info from URL
    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount');
    if (amount) {
      document.getElementById('amount').textContent = `₩${parseInt(amount).toLocaleString('ko-KR')}`;
    }

    // Auto-redirect after 5 seconds
    setTimeout(() => {
      // In production, redirect back to ChatGPT or confirm the payment
      console.log('Confirming payment...');
    }, 3000);
  </script>
</body>
</html>
