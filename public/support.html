<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 지원 - klygo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.5rem; }
    .header p { opacity: 0.9; font-size: 14px; margin-top: 4px; }
    .container { max-width: 500px; margin: 0 auto; padding: 20px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover { background: #5a6fd6; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .contact-info {
      text-align: center;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
    }
    .contact-info a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .contact-info p {
      margin: 8px 0;
      color: #666;
    }
    .success {
      background: #e8f5e9;
      border: 1px solid #4caf50;
      color: #2e7d32;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .success.show { display: block; }
    .error {
      background: #ffebee;
      border: 1px solid #f44336;
      color: #c62828;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>고객 지원</h1>
    <p>문의사항을 남겨주세요</p>
  </div>

  <div class="container">
    <div id="success-msg" class="success">
      문의가 접수되었습니다. 빠른 시일 내 답변드리겠습니다.
    </div>

    <div id="error-msg" class="error">
      전송에 실패했습니다. 이메일로 직접 문의해주세요.
    </div>

    <div class="card">
      <h3>📧 문의하기</h3>
      <form id="support-form">
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="name" placeholder="홍길동" required>
        </div>

        <div class="form-group">
          <label>연락처 (이메일 또는 전화번호)</label>
          <input type="text" id="contact" placeholder="example@email.com 또는 010-1234-5678" required>
        </div>

        <div class="form-group">
          <label>문의 유형</label>
          <select id="type">
            <option value="general">일반 문의</option>
            <option value="service">서비스 관련</option>
            <option value="price">가격/비용 문의</option>
            <option value="complaint">불만/민원</option>
            <option value="partnership">제휴/협력</option>
            <option value="other">기타</option>
          </select>
        </div>

        <div class="form-group">
          <label>문의 내용</label>
          <textarea id="message" placeholder="문의 내용을 자세히 적어주세요..." required></textarea>
        </div>

        <button type="submit" class="btn" id="submit-btn">문의 보내기</button>
      </form>
    </div>

    <div class="card">
      <div class="contact-info">
        <h3>📞 직접 연락</h3>
        <p>이메일: <a href="mailto:daepop98@gmail.com">daepop98@gmail.com</a></p>
        <p style="font-size: 13px; color: #999; margin-top: 12px;">
          평일 09:00 ~ 18:00 (주말/공휴일 휴무)<br>
          답변은 1~2영업일 내 드립니다.
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('support-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '전송 중...';

      const data = {
        name: document.getElementById('name').value,
        contact: document.getElementById('contact').value,
        type: document.getElementById('type').value,
        message: document.getElementById('message').value,
      };

      try {
        const res = await fetch('/api/support/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
          document.getElementById('success-msg').classList.add('show');
          document.getElementById('support-form').reset();
        } else {
          document.getElementById('error-msg').classList.add('show');
        }
      } catch (err) {
        document.getElementById('error-msg').classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = '문의 보내기';
      }
    });
  </script>
</body>
</html>
